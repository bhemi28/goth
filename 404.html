<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Redirecting...</title>
    
    <script>
        (function() {
            // 1. Get the path they were trying to visit
            var path = window.location.pathname;
            
            // 2. Redirect back to root. 
            // We use .replace so the 404 page doesn't stay in their back-button history.
            // If you want to keep it simple, just use "/"
            window.location.replace("/goth/");
        })();
    </script>

    <style>
        body {
            background-color: #eef2ff;
            color: #0f0f0f;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 3px solid #0f0f0f;
            background: #fff;
            padding: 2rem;
            box-shadow: 8px 8px 0px 0px #0f0f0f;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #312e81;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        a {
            background: #bbf7d0;
            color: #0f0f0f;
            text-decoration: none;
            border: 2px solid #0f0f0f;
            padding: 10px 20px;
            font-weight: bold;
            box-shadow: 4px 4px 0px 0px #0f0f0f;
            transition: transform 0.1s;
        }
        /* ... existing styles ... */
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Redirecting you home...</p>
        <a href="/">Return to Safety</a>
    </div>
</body>
</html>
