<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        body {
            background-color: #eef2ff;
            color: #0f0f0f;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 3px solid #0f0f0f;
            background: #fff;
            padding: 2rem;
            box-shadow: 8px 8px 0px 0px #0f0f0f;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #312e81;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        a {
            background: #bbf7d0;
            color: #0f0f0f;
            text-decoration: none;
            border: 2px solid #0f0f0f;
            padding: 10px 20px;
            font-weight: bold;
            box-shadow: 4px 4px 0px 0px #0f0f0f;
            transition: transform 0.1s;
        }
        a:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #0f0f0f;
        }
        a:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #0f0f0f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page Not Found</p>
        <a href="/index.html">Return to Safety</a>
    </div>
</body>
</html>
